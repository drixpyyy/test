<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Button Samples</title>
    <style>
        :root {
            --page-bg: #f2f2f2;
            --card-shadow: 0 2px 12px rgba(0, 0, 0, 0.07), 0 1px 3px rgba(0, 0, 0, 0.04);
            --card-hover-shadow: 0 6px 24px rgba(0, 0, 0, 0.11), 0 2px 6px rgba(0, 0, 0, 0.06);
            --card-radius: 18px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--page-bg);
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .scroll-wrapper {
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scroll-snap-type: x proximity;
            cursor: grab;
            padding: 0 40px;
            display: flex;
            align-items: center;
            min-height: 280px;
            /* hide scrollbar visually but keep functionality */
            scrollbar-width: thin;
            scrollbar-color: transparent transparent;
            transition: scrollbar-color 0.3s;
        }

        .scroll-wrapper:hover {
            scrollbar-color: #c5c5c5 #e8e8e8;
        }

        .scroll-wrapper::-webkit-scrollbar {
            height: 6px;
            background: transparent;
        }

        .scroll-wrapper::-webkit-scrollbar-track {
            background: transparent;
            border-radius: 3px;
        }

        .scroll-wrapper::-webkit-scrollbar-thumb {
            background: transparent;
            border-radius: 3px;
            transition: background 0.3s;
        }

        .scroll-wrapper:hover::-webkit-scrollbar-thumb {
            background: #c5c5c5;
        }

        .scroll-wrapper::-webkit-scrollbar-thumb:hover {
            background: #a0a0a0;
        }

        .scroll-inner {
            display: flex;
            gap: 22px;
            padding: 10px 0;
            align-items: stretch;
        }

        /* Spacer elements for better snap alignment at edges */
        .scroll-spacer {
            flex-shrink: 0;
            width: 20px;
            scroll-snap-align: start;
        }

        .scroll-spacer-end {
            flex-shrink: 0;
            width: 20px;
            scroll-snap-align: end;
        }

        .card {
            flex-shrink: 0;
            width: 290px;
            height: 210px;
            border-radius: var(--card-radius);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: var(--card-shadow);
            scroll-snap-align: center;
            transition: box-shadow 0.35s ease, transform 0.35s ease;
            overflow: hidden;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        .card:hover {
            box-shadow: var(--card-hover-shadow);
            transform: translateY(-2px);
        }

        .card-label {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            color: rgba(0, 0, 0, 0.28);
            pointer-events: none;
            white-space: nowrap;
            transition: color 0.3s;
        }

        .card.dark-label .card-label {
            color: rgba(255, 255, 255, 0.35);
        }

        .card:hover .card-label {
            color: rgba(0, 0, 0, 0.5);
        }

        .card.dark-label:hover .card-label {
            color: rgba(255, 255, 255, 0.6);
        }

        /* ==================== BUTTON STYLES ==================== */

        /* MD3 Button */
        .btn-md3 {
            background: #6750A4;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 14px 28px;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, .25);
            transition: .2s;
            font-family: Arial, sans-serif;
            white-space: nowrap;
        }
        .btn-md3:hover {
            box-shadow: 0 4px 12px rgba(0, 0, 0, .35);
        }

        /* MD2 Button */
        .btn-md2 {
            background: #6200ee;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 12px 24px;
            font-size: 14px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, .3);
            font-family: Roboto, sans-serif;
            white-space: nowrap;
        }
        .btn-md2:hover {
            background: #6f1dff;
        }

        /* MD1 Button */
        .btn-md1 {
            background: #2196f3;
            color: white;
            border: none;
            border-radius: 2px;
            padding: 10px 22px;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .3);
            font-family: Arial, sans-serif;
            white-space: nowrap;
        }
        .btn-md1:hover {
            background: #42a5f5;
        }

        /* Glassmorphism Button */
        .btn-glass {
            padding: 14px 30px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, .25);
            background: rgba(255, 255, 255, .15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: white;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(0, 0, 0, .2);
            font-family: Arial, sans-serif;
            white-space: nowrap;
        }
        .btn-glass:hover {
            background: rgba(255, 255, 255, .22);
        }

        /* Neumorphism Button */
        .btn-neumorphism {
            padding: 16px 34px;
            border: none;
            border-radius: 14px;
            background: #dde1e7;
            color: #444;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 8px 8px 16px #bec3c9, -8px -8px 16px #ffffff;
            font-family: Arial, sans-serif;
            white-space: nowrap;
        }
        .btn-neumorphism:active {
            box-shadow: inset 6px 6px 12px #bec3c9, inset -6px -6px 12px #ffffff;
        }

        /* Fluent UI Button */
        .btn-fluent {
            background: rgba(255, 255, 255, .08);
            color: white;
            border: 1px solid rgba(255, 255, 255, .15);
            border-radius: 8px;
            padding: 12px 28px;
            font-size: 15px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: .2s;
            font-family: 'Segoe UI', sans-serif;
            white-space: nowrap;
        }
        .btn-fluent:hover {
            background: rgba(255, 255, 255, .14);
        }

        /* Retro Button */
        .btn-retro {
            background: #ff7675;
            color: #2d3436;
            border: 4px solid #2d3436;
            padding: 16px 34px;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 6px 6px 0 #2d3436;
            font-family: "Courier New", monospace;
            white-space: nowrap;
        }
        .btn-retro:active {
            transform: translate(4px, 4px);
            box-shadow: 2px 2px 0 #2d3436;
        }

        /* Minimal Button */
        .btn-minimal {
            background: none;
            color: black;
            border: 1px solid black;
            padding: 12px 28px;
            font-size: 14px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: .2s;
            font-family: Helvetica, sans-serif;
            white-space: nowrap;
        }
        .btn-minimal:hover {
            background: black;
            color: white;
        }

        /* Cyberpunk Button */
        .btn-cyberpunk {
            background: #00f0ff;
            color: #111;
            border: none;
            padding: 16px 36px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
            box-shadow: 0 0 20px #00f0ff;
            font-family: Arial, sans-serif;
            white-space: nowrap;
        }
        .btn-cyberpunk:hover {
            box-shadow: 0 0 35px #00f0ff;
        }

        /* Vaporwave Button */
        .btn-vaporwave {
            background: rgba(255, 255, 255, .2);
            border: 2px solid white;
            color: white;
            padding: 14px 30px;
            font-size: 16px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            cursor: pointer;
            text-shadow: 0 0 10px white;
            font-family: Verdana, sans-serif;
            white-space: nowrap;
        }

        /* Brutalist Button */
        .btn-brutalist {
            background: #ff0;
            color: #000;
            border: 4px solid #000;
            padding: 18px 36px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 0;
            font-family: Arial, sans-serif;
            white-space: nowrap;
        }
        .btn-brutalist:hover {
            background: #000;
            color: #ff0;
        }

        /* Luxury Button */
        .btn-luxury {
            background: linear-gradient(135deg, #d4af37, #f6e27a);
            color: #111;
            border: none;
            padding: 14px 34px;
            font-size: 16px;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(212, 175, 55, .4);
            font-family: Georgia, serif;
            white-space: nowrap;
        }

        /* Pixel Art Button */
        .btn-pixel {
            background: #32cd32;
            color: #000;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            image-rendering: pixelated;
            cursor: pointer;
            box-shadow: 0 0 0 4px #000, 4px 4px 0 4px #555;
            font-family: "Courier New", monospace;
            white-space: nowrap;
        }
        .btn-pixel:active {
            transform: translate(4px, 4px);
        }

        /* Monochrome Button */
        .btn-monochrome {
            background: #222;
            color: #f5f5f5;
            border: 1px solid #666;
            padding: 14px 32px;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            font-family: Arial, sans-serif;
            white-space: nowrap;
        }
        .btn-monochrome:hover {
            background: #f5f5f5;
            color: #111;
        }

        /* Terminal Button */
        .btn-terminal {
            background: black;
            color: #00ff66;
            border: 1px solid #00ff66;
            padding: 14px 28px;
            font-size: 16px;
            cursor: pointer;
            text-shadow: 0 0 8px #00ff66;
            box-shadow: 0 0 10px #00ff66 inset;
            font-family: monospace;
            white-space: nowrap;
        }

        /* Soft UI Button */
        .btn-softui {
            border: none;
            border-radius: 18px;
            padding: 16px 36px;
            background: #ecf0f3;
            color: #555;
            font-size: 15px;
            cursor: pointer;
            box-shadow: -8px -8px 16px #ffffff, 8px 8px 16px #c5c9cc;
            font-family: Arial, sans-serif;
            white-space: nowrap;
        }

        /* Aurora Gradient Button */
        .btn-aurora {
            padding: 16px 38px;
            border: none;
            border-radius: 999px;
            font-size: 16px;
            color: white;
            cursor: pointer;
            background: linear-gradient(135deg, #22d3ee, #8b5cf6, #ec4899);
            background-size: 200% 200%;
            animation: auroraGlow 5s ease infinite;
            box-shadow: 0 0 30px rgba(139, 92, 246, .5);
            font-family: Arial, sans-serif;
            white-space: nowrap;
        }
        @keyframes auroraGlow {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* Paper Style Button */
        .btn-paper {
            background: #fffdf7;
            border: 2px solid #222;
            padding: 16px 34px;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 5px 5px 0 #c8c2b5;
            transform: rotate(-1deg);
            font-family: "Times New Roman", serif;
            white-space: nowrap;
        }

        /* Holographic Button */
        .btn-holographic {
            border: none;
            padding: 16px 36px;
            border-radius: 16px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            background: linear-gradient(120deg,
                    #ff00cc,
                    #3333ff,
                    #00ffee,
                    #ffcc00);
            background-size: 300% 300%;
            animation: holoShift 6s linear infinite;
            font-family: sans-serif;
            white-space: nowrap;
        }
        @keyframes holoShift {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 100% 50%;
            }
        }

        /* Arcade Button */
        .btn-arcade {
            background: #ff004c;
            color: #fff;
            border: 4px solid #fff;
            padding: 18px 34px;
            font-size: 20px;
            cursor: pointer;
            text-shadow: 2px 2px #000;
            box-shadow: 0 0 18px #ff004c;
            font-family: monospace;
            white-space: nowrap;
        }
        .btn-arcade:hover {
            background: #00e5ff;
            box-shadow: 0 0 18px #00e5ff;
        }

        /* Nature Button */
        .btn-nature {
            background: #2d6a4f;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 15px 34px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0, 0, 0, .2);
            font-family: Verdana, sans-serif;
            white-space: nowrap;
        }

        /* Wireframe Button */
        .btn-wireframe {
            background: transparent;
            color: #222;
            border: 2px dashed #444;
            padding: 16px 32px;
            font-size: 15px;
            cursor: pointer;
            font-family: sans-serif;
            white-space: nowrap;
        }

        /* Liquid Button */
        .btn-liquid {
            border: none;
            color: white;
            padding: 16px 38px;
            font-size: 16px;
            border-radius: 60px;
            cursor: pointer;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            box-shadow:
                inset 0 2px 8px rgba(255, 255, 255, .3),
                0 8px 24px rgba(0, 114, 255, .5);
            font-family: sans-serif;
            white-space: nowrap;
        }

        /* Industrial Button */
        .btn-industrial {
            background: #555;
            color: #eee;
            border: 2px solid #888;
            padding: 15px 34px;
            font-size: 16px;
            cursor: pointer;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, .2),
                0 4px 8px rgba(0, 0, 0, .5);
            font-family: Arial, sans-serif;
            white-space: nowrap;
        }

        /* Dreamy Button */
        .btn-dreamy {
            border: none;
            border-radius: 999px;
            padding: 16px 36px;
            font-size: 16px;
            color: #5a189a;
            background: rgba(255, 255, 255, .6);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 255, 255, .4);
            font-family: sans-serif;
            white-space: nowrap;
        }

        /* Sci-Fi Panel Button */
        .btn-scifi {
            padding: 16px 40px;
            background: #0f172a;
            color: #38bdf8;
            border: 1px solid #38bdf8;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0% 100%);
            cursor: pointer;
            font-size: 16px;
            box-shadow: 0 0 20px rgba(56, 189, 248, .3);
            font-family: Arial, sans-serif;
            white-space: nowrap;
        }

        /* ==================== RESPONSIVE ==================== */
        @media (max-width: 768px) {
            .scroll-wrapper {
                padding: 0 20px;
            }
            .scroll-inner {
                gap: 14px;
            }
            .card {
                width: 250px;
                height: 185px;
                border-radius: 14px;
            }
            .scroll-spacer,
            .scroll-spacer-end {
                width: 10px;
            }
        }

        @media (max-width: 480px) {
            .scroll-wrapper {
                padding: 0 10px;
            }
            .scroll-inner {
                gap: 10px;
            }
            .card {
                width: 220px;
                height: 170px;
                border-radius: 12px;
            }
            .scroll-spacer,
            .scroll-spacer-end {
                width: 6px;
            }
        }
    </style>
</head>
<body>
<p class="chatgpt-label">ChatGPT</p>
    <div class="scroll-wrapper" aria-label="Scrollable UI button samples">
        <div class="scroll-inner">

            <!-- Leading spacer for snap alignment -->
            <div class="scroll-spacer"></div>

            <!-- 1. MD3 Button -->
            <div class="card" style="background:#f5f5f5;">
                <button class="btn-md3">MD3 Button</button>
                <span class="card-label">MD3</span>
            </div>

            <!-- 2. MD2 Button -->
            <div class="card" style="background:#eceff1;">

            </div>

            <!-- 9. Cyberpunk Button -->

            </div>

            <!-- 10. Vaporwave Button -->
            <div class="card dark-label" style="background:linear-gradient(180deg,#ff9ff3,#48dbfb);">
                <button class="btn-vaporwave">VAPOR</button>
                <span class="card-label">Vaporwave</span>
            </div>

            <!-- 11. Brutalist Button -->
            <div class="card" style="background:#fff;">
                <button class="btn-brutalist">BRUTAL</button>
                <span class="card-label">Brutalist</span>
            </div>

            <!-- 12. Luxury Button -->
            <div class="card dark-label" style="background:#111;">
                <button class="btn-luxury">LUXURY</button>
                <span class="card-label">Luxury</span>
            </div>

            <!-- 13. Pixel Art Button -->
            <div class="card dark-label" style="background:#222;">
                <button class="btn-pixel">PIXEL</button>
                <span class="card-label">Pixel Art</span>
            </div>

            <!-- 14. Monochrome Button -->
            <div class="card dark-label" style="background:#111;">
                <button class="btn-monochrome">MONO</button>
                <span class="card-label">Monochrome</span>
            </div>

            <!-- 15. Terminal Button -->
            <div class="card dark-label" style="background:#000000;">
                <button class="btn-terminal">> RUN.exe</button>
                <span class="card-label">Terminal</span>
            </div>

            <!-- 16. Soft UI Button -->
            <div class="card" style="background:#ecf0f3;">
                <button class="btn-softui">SOFT UI</button>
                <span class="card-label">Soft UI</span>
            </div>

            <!-- 17. Aurora Gradient Button -->
            <div class="card dark-label" style="background:#0f172a;">
                <button class="btn-aurora">AURORA</button>
                <span class="card-label">Aurora</span>
            </div>

            <!-- 18. Paper Style Button -->
            <div class="card" style="background:#f8f3e8;">
                <button class="btn-paper">PAPER</button>
                <span class="card-label">Paper</span>
            </div>

            <!-- 19. Holographic Button -->
            <div class="card dark-label" style="background:#080808;">
                <button class="btn-holographic">HOLO</button>
                <span class="card-label">Holographic</span>
            </div>

            <!-- 20. Arcade Button -->
            <div class="card dark-label" style="background:#111827;">
                <button class="btn-arcade">ARCADE</button>
                <span class="card-label">Arcade</span>
            </div>

            <!-- 21. Nature Button -->
            <div class="card" style="background:linear-gradient(#c7f9cc,#80ed99);">
                <button class="btn-nature">NATURE</button>
                <span class="card-label">Nature</span>
            </div>

            <!-- 22. Wireframe Button -->
            <div class="card" style="background:#fafafa;">
                <button class="btn-wireframe">WIREFRAME</button>
                <span class="card-label">Wireframe</span>
            </div>

            <!-- 23. Liquid Button -->
            <div class="card dark-label" style="background:#07111f;">
                <button class="btn-liquid">LIQUID</button>
                <span class="card-label">Liquid</span>
            </div>

            <!-- 24. Industrial Button -->
            <div class="card dark-label" style="background:#2b2b2b;">
                <button class="btn-industrial">INDUSTRIAL</button>
                <span class="card-label">Industrial</span>
            </div>

            <!-- 25. Dreamy Button -->
            <div class="card" style="background:linear-gradient(135deg,#ffd6e0,#c8b6ff);">
                <button class="btn-dreamy">DREAM</button>
                <span class="card-label">Dreamy</span>
            </div>

            <!-- 26. Sci-Fi Panel Button -->
            <div class="card dark-label" style="background:#050816;">
                <button class="btn-scifi">SCI-FI</button>
                <span class="card-label">Sci-Fi</span>
            </div>

            <!-- Trailing spacer for snap alignment -->
            <div class="scroll-spacer-end"></div>

        </div>
    </div>

</body>
</html>
